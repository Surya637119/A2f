name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Flet & Flutter
        uses: actions/cache@v4
        with:
          path: |
            ~/.flet
            ~/.pub-cache
          key: v2-${{ runner.os }}-flet-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            v2-${{ runner.os }}-flet-

      - name: Install Flet
        run: pip install flet==1.0.5

      # PERBAIKAN: Terima semua lisensi Android SDK secara otomatis
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build APK
        run: flet build apk --yes --arch arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/apk
