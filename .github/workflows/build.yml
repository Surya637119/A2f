name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Flet & Flutter
        uses: actions/cache@v4
        with:
          path: |
            ~/.flet
            ~/.pub-cache
          key: v4-${{ runner.os }}-flet-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            v4-${{ runner.os }}-flet-

      - name: Install Flet
        run: pip install flet==1.0.5

      # HAPUS LANGKAH SETUP ANDROID, KITA PAKAI CARA INI
      - name: Accept Android Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Build APK
        run: flet build apk --yes --arch arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/apk
