name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Debug: pastikan file proyek ada di tempat yang benar
      - name: Show project files
        run: |
          echo "== Root =="; ls -la
          echo "== pyproject.toml =="; cat pyproject.toml || echo "TIDAK ADA pyproject.toml"
          echo "== File .py =="; find . -name "*.py" -not -path "./build/*" -not -path "./.git/*"

      # Pemeriksaan syntax: penyebab paling mungkin build berhenti
      # setelah 'compileall' tanpa pesan error yang jelas.
      - name: Check Python syntax
        run: python -m compileall -q -x '/(build|\.git|\.github)/' .

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Cache Flet, Flutter & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.flet
            ~/flutter
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: flet-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
          restore-keys: |
            flet-${{ runner.os }}-

      - name: Install Flet
        run: pip install flet==1.0.5

      - name: Build APK
        shell: bash   # bash dengan pipefail, supaya exit code tidak hilang saat pakai tee
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"   # log polos, tidak terpotong kotak/warna
        run: flet build apk --yes --arch arm64-v8a -vv 2>&1 | tee build.log

      - name: Show last lines of log
        if: failure()
        run: |
          echo "===== 150 baris terakhir ====="
          tail -n 150 build.log || true
          echo "===== Baris yang mengandung error ====="
          grep -n -i -E "error|exception|traceback|failure|failed|SyntaxError" build.log | tail -n 60 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: List build output
        if: always()
        run: ls -lhR build/apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 14
