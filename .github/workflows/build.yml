name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK sudah ada di runner (ANDROID_HOME).
      # Cukup accept lisensi, tanpa action setup-android.
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Cache Flet, Flutter & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.flet
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: flet-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
          restore-keys: |
            flet-${{ runner.os }}-

      - name: Install Flet
        run: pip install flet==1.0.5

      - name: Build APK
        run: flet build apk --yes --arch arm64-v8a -v

      - name: List build output
        if: always()
        run: ls -lh build/apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 14
